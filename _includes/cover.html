{%- assign w = include.width | default: 80 -%}
{%- assign w2 = w | times: 2 -%}
{%- assign css = include.class | default: "catalog-cover" -%}
{%- if include.entry.cover contains "://" -%}
<img src="{{ include.entry.cover }}" alt="Copertina di {{ include.entry.title }}" class="{{ css }}" loading="lazy" />
{%- else -%}
{%- assign base = site.media_url | append: "/" | append: include.entry.cover -%}
<img src="{{ base }}?w={{ w }}&auto=format,compress"
  srcset="{{ base }}?w={{ w }}&auto=format,compress 1x, {{ base }}?w={{ w2 }}&auto=format,compress 2x"
  alt="Copertina di {{ include.entry.title }}" class="{{ css }}" loading="lazy" />
{%- endif -%}
