<!DOCTYPE html>
<html lang="{%if page.lang %}{{page.lang}}{%else%}it{%endif%}">

<head>
  <meta charset="utf-8" />
  {% assign listing = site.data[page.data_source] %}
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Virtual tour — {{ listing.title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Inter", sans-serif;
    }

    #tour {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .scene-links {
      position: fixed;
      left: 50%;
      bottom: 1.5em;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.8em;
      z-index: 10;
      max-width: 90vw;
    }

    .scene-links a {
      padding: 0.5em 1.2em;
      border-radius: 8px;
      text-decoration: none;
      color: #fff;
      background: rgba(20, 18, 16, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 0.9em;
      font-weight: 600;
      backdrop-filter: blur(4px);
      transition: background 0.15s;
    }

    .scene-links a:hover {
      background: rgba(194, 65, 12, 0.85);
    }

    .back-link {
      position: fixed;
      left: 1em;
      top: 1em;
      z-index: 10;
      padding: 0.5em 1em;
      border-radius: 8px;
      text-decoration: none;
      color: #fff;
      background: rgba(20, 18, 16, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 0.9em;
      backdrop-filter: blur(4px);
    }

    .back-link:hover {
      background: rgba(194, 65, 12, 0.85);
    }

    #debug-box {
      position: fixed;
      right: 1em;
      bottom: 1em;
      z-index: 10;
      padding: 0.6em 0.9em;
      border-radius: 8px;
      color: #fff;
      background: rgba(20, 18, 16, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-family: monospace;
      font-size: 0.85em;
      line-height: 1.5;
      backdrop-filter: blur(4px);
      white-space: pre;
    }

    #debug-crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      width: 32px;
      height: 32px;
      pointer-events: none;
    }

    #debug-crosshair::before,
    #debug-crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 60, 60, 0.85);
    }

    #debug-crosshair::before {
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      transform: translateX(-50%);
    }

    #debug-crosshair::after {
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      transform: translateY(-50%);
    }
  </style>
</head>

<body>
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <main id="tour"></main>

  <a class="back-link" href="{{ page.listing_url }}">&larr; Torna all'annuncio</a>

  <div class="scene-links">
    {% for scene in listing.tour.scene_links %}
    <a href="#" onclick="tourViewer.loadScene('{{ scene.id }}'); return false;">{{ scene.label }}</a>
    {% endfor %}
  </div>

  <div id="debug-box" style="display: none;"></div>
  <div id="debug-crosshair" style="display: none;"></div>

  <script>
    var tourViewer = pannellum.viewer('tour', {
      default: {{ listing.tour.default | jsonify }},
      scenes: {{ listing.tour.scenes | jsonify }}
    });

    if (window.location.hash === '#debug') {
      var debugBox = document.getElementById('debug-box');
      debugBox.style.display = 'block';
      document.getElementById('debug-crosshair').style.display = 'block';
      setInterval(function () {
        debugBox.textContent =
          'yaw: ' + tourViewer.getYaw() +
          '\npitch: ' + tourViewer.getPitch() +
          '\nhfov: ' + tourViewer.getHfov();
      }, 200);
    }
  </script>
</body>

</html>
